# jrsctl configuration (docs/spec.md section 5.1). Secrets are references only.
server:
  baseUrl: http://localhost:8081/jasperserver-pro
  webappName: jasperserver-pro
  installDir: C:\Jaspersoft\jasperreports-server-10.0.0
  tomcatDir: C:\Jaspersoft\jasperreports-server-10.0.0\apache-tomcat
  auth:
    mode: basic
    username: jasperadmin
    passwordRef: env:JRS_PASSWORD
service:
  kind: windows-service
  name: jasperreportsPostgreSQL
  stopTimeoutSeconds: 180
database:
  type: postgresql
  username: postgres
  passwordRef: env:JRS_DB_PASSWORD
vendor:
  javaHome: C:\Jaspersoft\jasperreports-server-10.0.0\java
network:
  mode: isolated
  proxy: {}
  trustStore: {}
console:
  bind: 127.0.0.1
  port: 7420
  tls:
    enabled: false
  auth:
    mode: token
backups:
  retentionDays: 30
  maxSnapshots: 20
smoke:
  reportUri: /public/Samples/Reports/AllAccounts
