name: Publish to GitHub Packages

# Runs on the tag push itself, not on the release event: the release is created by ci.yml with
# GITHUB_TOKEN, and events raised with that token never trigger other workflows, so a `release`
# trigger here would never fire. `workflow_dispatch` with a tag re-publishes an existing release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (for example v1.0.1)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Maven Packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github

      - name: Use the release tag as the version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v*) ;; *) echo "::error::not a release tag: $TAG"; exit 1 ;; esac
          ./mvnw -B -q org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="${TAG#v}" -DprocessAllModules=true -DgenerateBackupPoms=false -DupdateBuildOutputTimestamp=false

      - name: "Publish to GitHub Packages (release profile: never a SNAPSHOT)"
        # the repository this workflow runs in, not the one the tag's pom names: after the repository
        # was renamed (jrs-ctl -> jrsctl), v2.1.0's pom still named the old package endpoint, which
        # GitHub Packages does not redirect
        run: >-
          ./mvnw -B -DskipTests -Prelease deploy
          -DaltDeploymentRepository=github::https://maven.pkg.github.com/${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
