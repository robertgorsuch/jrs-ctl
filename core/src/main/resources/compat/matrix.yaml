# jrsctl compatibility matrix (spec 5.7).
# matrix version 1, unsigned: it ships inside the same artifact as any key that could verify it,
# so a signature would add no assurance. Version ranges use npm/semver syntax as understood by
# semver4j; JRS versions with two components (e.g. "8.2") are coerced to x.y.0 before matching.
matrixVersion: 1
signed: false

entries:
  - range: ">=7.1.0 <7.5.0"
    label: "JasperReports Server 7.1 - 7.2"
    editions: [CE, PRO]
    appServers: [tomcat]
    javaForBuildomatic: 8
    databases: [postgresql, mysql, oracle, mssql, db2]
    expectedCapabilities:
      all: [EXPORT_ASYNC, IMPORT_ASYNC, REST_LOGIN]
      PRO: [ORGS]

  - range: ">=7.5.0 <8.0.0"
    label: "JasperReports Server 7.5 - 7.9"
    editions: [CE, PRO]
    appServers: [tomcat]
    javaForBuildomatic: 8
    databases: [postgresql, mysql, oracle, mssql, db2]
    expectedCapabilities:
      all: [EXPORT_ASYNC, IMPORT_ASYNC, REST_LOGIN, KEYSTORE_ENCRYPTION]
      PRO: [ORGS]

  - range: ">=8.0.0 <9.0.0"
    label: "JasperReports Server 8.x"
    editions: [CE, PRO]
    appServers: [tomcat]
    javaForBuildomatic: 11
    databases: [postgresql, mysql, oracle, mssql, db2]
    expectedCapabilities:
      all: [EXPORT_ASYNC, IMPORT_ASYNC, REST_LOGIN, KEYSTORE_ENCRYPTION, TOKEN_AUTH, PREAUTH]
      PRO: [ORGS]

  - range: ">=9.0.0 <10.0.0"
    label: "JasperReports Server 9.x"
    editions: [CE, PRO]
    appServers: [tomcat]
    javaForBuildomatic: 17
    databases: [postgresql, mysql, oracle, mssql, db2]
    expectedCapabilities:
      all: [EXPORT_ASYNC, IMPORT_ASYNC, REST_LOGIN, KEYSTORE_ENCRYPTION, TOKEN_AUTH, PREAUTH]
      PRO: [ORGS]

  - range: ">=10.0.0 <11.0.0"
    label: "JasperReports Server 10.x"
    editions: [CE, PRO]
    appServers: [tomcat]
    javaForBuildomatic: 17
    databases: [postgresql, mysql, oracle, mssql, db2]
    expectedCapabilities:
      all: [EXPORT_ASYNC, IMPORT_ASYNC, REST_LOGIN, KEYSTORE_ENCRYPTION, TOKEN_AUTH, PREAUTH]
      PRO: [ORGS]

# from-range -> to-range; the target must also be strictly newer than the source.
upgradePaths:
  - { from: "7.x", to: "7.x" }
  - { from: "7.x", to: "8.x" }
  - { from: "8.x", to: "8.x" }
  - { from: "8.x", to: "9.x" }
  - { from: "8.x", to: "10.x" }
  - { from: "9.x", to: "9.x" }
  - { from: "9.x", to: "10.x" }
  - { from: "10.x", to: "10.x" }
